name: Streak reminder
on:
  schedule:
    - cron: "0 * * * *"   # hourly; the script only sends at the phone's chosen hour
  workflow_dispatch:
    inputs:
      force:
        description: "Send now (test)"
        type: boolean
        default: true
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save web-push@3.6.7
      - run: node scripts/remind.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          REMIND_CODE: ${{ secrets.REMIND_CODE }}
          FORCE: ${{ inputs.force }}
